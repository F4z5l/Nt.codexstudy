<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1719">
  <meta name="description" content="Watch your CODEXSTUDYS lesson.">
  <title>Lesson player — CODEXSTUDYS</title>
  <link rel="icon" href="assets/codex-mark.svg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.12.5/dist/shaka-player.compiled.min.js"></script>
</head>
<body data-page="player" class="player-page">
  <div class="player-shell"><header class="player-top"><button id="backFromPlayer" class="player-back" aria-label="Go back">←</button><a class="brand" href="index.html"><img src="assets/codex-mark.svg" alt=""><span class="brand-name">CODEX<span>STUDYS</span></span></a><span style="color:#8ea5a4;font-size:12px;margin-left:auto">Focused player</span></header>
    <main><div class="video-stage"><video id="video" controls playsinline preload="metadata" aria-label="Course lesson video"></video><div id="videoMessage" class="video-message"><div class="play-icon">▶</div><h1 class="player-title">Lesson player</h1><p id="videoMessageText">Preparing your lesson. If playback does not start, check the source or try again.</p></div><div class="resume-bar" aria-label="Lesson progress"><span></span></div></div><div class="player-info"><div><span class="eyebrow" style="color:var(--mint)">Now learning</span><h1 class="player-title">Lesson player</h1><p>Progress is saved on this device so you can come back without losing your place.</p></div><div class="player-actions"><button class="btn btn-ghost" onclick="history.back()">← Back to course</button><a class="btn btn-secondary" href="courses.html">Browse courses ↗</a></div></div></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
